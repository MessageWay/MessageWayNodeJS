name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish to npm)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code quality check (lint, format, types)
        run: pnpm run check

      - name: Run test suite
        run: pnpm test

  publish:
    name: Build & Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing & Provenance via OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package (Vite+ / tsdown)
        run: pnpm run build

      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: pnpm publish --dry-run --access public --no-git-checks

      - name: Publish to npm (Trusted Publishing via OIDC)
        if: ${{ inputs.dry_run != true }}
        run: pnpm publish --access public --no-git-checks --provenance
